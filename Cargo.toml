[package]
name = "rs_maze_maker"
version = "1.1.2"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"
rand = "0.9.2"
threadpool = "1.8"
clap = { version = "4.5.47", features = ["derive"] }
image = "0.25.8"
chrono = { version = "0.4.42", features = ["serde"] }
petgraph = "0.8.2"
test-log = "0.2.18"
dirs = "6.0.0"
num_cpus = "1.17.0"
dotenv = "0.14.1"
sea-orm = { version = "1.1.19", features = [ "sqlx-mysql", "runtime-tokio-native-tls", "macros","with-chrono" ] }
[dev-dependencies]
tempfile = "3.22.0"
tokio = { version = "1.36.0", features = ["full"] }