[package]
name = "rs_maze_make"
version = "1.3.3"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"
rand = "0.10.2"
threadpool = "1.8"
clap = { version = "4.5.47", features = ["derive"] }
image = "0.25.8"
chrono = { version = "0.4.42", features = ["serde"] }
petgraph = "0.8.2"
test-log = "0.2.18"
dirs = "6.0.0"
num_cpus = "1.17.0"

[dependencies.uuid]
version = "1.24.0"
# Lets you generate random UUIDs
features = [
    "v4",
]

[dev-dependencies]
tempfile = "3.22.0"
